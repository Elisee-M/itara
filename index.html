<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f8" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Home Lamp</title>
    <script>
      (function () {
        try {
          var storageKey = 'home-lamp-theme';
          var theme = localStorage.getItem(storageKey);
          if (!theme) {
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            theme = prefersDark ? 'lagoon' : 'light';
          }
          if (theme === 'lagoon') {
            document.documentElement.setAttribute('data-theme', 'lagoon');
            var metaTheme = document.querySelector('meta[name="theme-color"]');
            if (metaTheme) metaTheme.setAttribute('content', '#0F1B1E');
            var metaCS = document.querySelector('meta[name="color-scheme"]');
            if (metaCS) metaCS.setAttribute('content', 'dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            var metaTheme2 = document.querySelector('meta[name="theme-color"]');
            if (metaTheme2) metaTheme2.setAttribute('content', '#f7f7f8');
            var metaCS2 = document.querySelector('meta[name="color-scheme"]');
            if (metaCS2) metaCS2.setAttribute('content', 'light');
          }
        } catch (e) {
          // ignore
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
